spring:
  application:
    name: banking-api

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:banking_api}
    username: ${DB_USER:banking_user}
    password: ${DB_PASSWORD:banking_pass}

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: ${SPRING_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info